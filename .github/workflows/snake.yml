name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write             # needed to push the SVGs to the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # First colour in color_dots = EMPTY cell. Dark uses visible slate #2d3343:
          # a near-black empty cell vanishes on GitHub's #0d1117 and the grid looks broken.
          outputs: |
            dist/github-snake.svg?color_snake=#DB2777&color_dots=#EDE9FE,#C4B5FD,#A78BFA,#8B5CF6,#6D28D9
            dist/github-snake-dark.svg?color_snake=#F472B6&color_dots=#2d3343,#4C3D8F,#6D55C9,#8B6FF0,#A78BFA

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
